<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini – retouche de sélection</title>
<style>
  body{margin:0;padding:10px;font:13px system-ui,sans-serif;background:#2b2b2b;color:#ddd}
  h1{font-size:14px;margin:0 0 6px}
  label{display:block;margin:9px 0 3px;opacity:.8}
  input,select,textarea{width:100%;box-sizing:border-box;background:#3a3a3a;color:#eee;
    border:1px solid #555;border-radius:3px;padding:5px;font:inherit}
  textarea{min-height:95px;resize:vertical}
  .row{display:flex;gap:8px}.row>div{flex:1}
  button{width:100%;margin-top:14px;padding:9px;background:#2d7ff9;color:#fff;border:0;
    border-radius:4px;cursor:pointer;font:inherit;font-weight:600}
  button:hover{background:#4a92fa}
  button:disabled{opacity:.5;cursor:wait}
  #st{margin-top:10px;min-height:2.6em;white-space:pre-wrap}
  #st.err{color:#ff8a80}
  .imgs{display:flex;gap:6px;margin-top:8px}
  .imgs img{max-width:49%;max-height:150px;object-fit:contain;background:#111;display:none}
  small{opacity:.65}
</style>
</head>
<body>
<h1>Retouche de la sélection avec Gemini</h1>

<label for="key">Clé API Google (Gemini)</label>
<input id="key" type="password" autocomplete="off" placeholder="AIza…">

<label for="model">Modèle</label>
<input id="model" list="models">
<datalist id="models">
  <option value="gemini-3.1-flash-image-preview">
  <option value="gemini-3.1-flash-image">
  <option value="gemini-3.1-flash-lite-image">
  <option value="gemini-2.5-flash-image">
</datalist>

<label for="prompt">Prompt</label>
<textarea id="prompt"></textarea>

<div class="row">
  <div>
    <label for="size">Résolution de sortie</label>
    <select id="size"><option>1K</option><option>2K</option><option>4K</option></select>
  </div>
  <div>
    <label for="ctx">Contexte autour (px)</label>
    <input id="ctx" type="number" min="0" step="10" value="0">
  </div>
</div>

<button id="go">Générer et remplacer la sélection</button>
<div id="st"></div>
<div class="imgs"><img id="imgIn" alt=""><img id="imgOut" alt=""></div>
<small>Le résultat est ajouté comme calque « Gemini » (annulable avec Ctrl+Z / suppression du calque).</small>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const PROMPT_DEFAUT = "Supprime les personnes sur la photo sans toucher au reste de l'image.";
$("key").value    = store.get("gk", "");
$("model").value  = store.get("gm", "gemini-3.1-flash-image-preview");
$("prompt").value = store.get("gp", PROMPT_DEFAUT);
$("size").value   = store.get("gs", "1K");
$("ctx").value    = store.get("gc", "0");

function status(t, err){ $("st").textContent = t; $("st").className = err ? "err" : ""; }

// --- Dialogue avec Photopea (cet iframe est le "plugin", Photopea est le parent) ---
function runScript(script, timeout = 240000){
  return new Promise((resolve, reject) => {
    const out = [];
    const t = setTimeout(() => { window.removeEventListener("message", h); reject(new Error("Photopea ne répond pas.")); }, timeout);
    function h(e){
      if (e.source !== window.parent) return;
      if (e.data === "done"){ clearTimeout(t); window.removeEventListener("message", h); resolve(out); }
      else out.push(e.data);
    }
    window.addEventListener("message", h);
    window.parent.postMessage(script, "*");
  });
}

const SCRIPT_SELECTION = `
function n(v){ return (v && v.value !== undefined) ? v.value : parseFloat(v); }
var r;
try {
  try { app.preferences.rulerUnits = Units.PIXELS; } catch(e) {}
  var d = app.activeDocument;
  var b = d.selection.bounds;
  r = {ok:1, l:n(b[0]), t:n(b[1]), r:n(b[2]), b:n(b[3]), w:n(d.width), h:n(d.height)};
} catch(e) { r = {ok:0}; }
app.echoToOE(JSON.stringify(r));`;

function scriptPlacement(L, T, W, H){
  return `
function n(v){ return (v && v.value !== undefined) ? v.value : parseFloat(v); }
var d = app.activeDocument, l = d.activeLayer;
var b = l.bounds, lw = n(b[2]) - n(b[0]), lh = n(b[3]) - n(b[1]);
if (Math.abs(lw - ${W}) > 0.5 || Math.abs(lh - ${H}) > 0.5) { l.resize(${W} / lw * 100, ${H} / lh * 100); }
b = l.bounds;
l.translate(${L} - n(b[0]), ${T} - n(b[1]));
try { l.name = "Gemini"; } catch(e) {}
app.echoToOE("OK");`;
}

// --- Gemini ---
const RATIOS = ["1:1","2:3","3:2","3:4","4:3","4:5","5:4","9:16","16:9","21:9"];
function meilleurRatio(w, h){
  const r = w / h; let best = RATIOS[0], d = 1e9;
  for (const s of RATIOS){
    const [a, b] = s.split(":").map(Number);
    const e = Math.abs(Math.log(r / (a / b)));
    if (e < d){ d = e; best = s; }
  }
  return best;
}

async function appelGemini(key, model, prompt, b64, ratio, size){
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent";
  const body = {
    contents: [{ parts: [ { text: prompt }, { inline_data: { mime_type: "image/png", data: b64 } } ] }],
    generationConfig: { responseModalities: ["TEXT", "IMAGE"], imageConfig: { aspectRatio: ratio, imageSize: size } }
  };
  const post = () => fetch(url, { method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": key }, body: JSON.stringify(body) });
  let r = await post();
  if (r.status === 400){            // certains modèles n'acceptent pas imageConfig
    delete body.generationConfig.imageConfig;
    r = await post();
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error("Gemini : " + ((j.error && j.error.message) || r.status));
  const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
  const img = parts.find(p => p.inlineData || p.inline_data);
  if (!img){
    const txt = parts.map(p => p.text).filter(Boolean).join(" ");
    throw new Error("Gemini n'a pas renvoyé d'image." + (txt ? "\n" + txt : ""));
  }
  const d = img.inlineData || img.inline_data;
  return { mime: d.mimeType || d.mime_type || "image/png", data: d.data };
}

async function go(){
  const btn = $("go");
  btn.disabled = true;
  try {
    const key = $("key").value.trim();
    const model = $("model").value.trim();
    const prompt = $("prompt").value.trim();
    const size = $("size").value;
    const ctx = Math.max(0, parseInt($("ctx").value, 10) || 0);
    if (!key) throw new Error("Clé API manquante.");
    if (!prompt) throw new Error("Prompt vide.");
    store.set("gk", key); store.set("gm", model); store.set("gp", prompt);
    store.set("gs", size); store.set("gc", String(ctx));

    status("Lecture de la sélection…");
    const o = await runScript(SCRIPT_SELECTION);
    const txt = o.find(x => typeof x === "string" && x[0] === "{");
    const sel = txt ? JSON.parse(txt) : { ok: 0 };
    if (!sel.ok || sel.r - sel.l < 2 || sel.b - sel.t < 2) throw new Error("Aucune sélection rectangulaire détectée.");
    const L = Math.round(sel.l), T = Math.round(sel.t);
    const W = Math.round(sel.r) - L, H = Math.round(sel.b) - T;

    // zone envoyée = sélection + marge de contexte (bornée à l'image)
    const EX = Math.max(0, L - ctx), EY = Math.max(0, T - ctx);
    const EW = Math.min(Math.round(sel.w), L + W + ctx) - EX;
    const EH = Math.min(Math.round(sel.h), T + H + ctx) - EY;

    status("Export de l'image depuis Photopea…");
    const buf = (await runScript('app.activeDocument.saveToOE("png")')).find(x => x instanceof ArrayBuffer);
    if (!buf) throw new Error("Export impossible depuis Photopea.");
    const bmp = await createImageBitmap(new Blob([buf], { type: "image/png" }));

    const c = document.createElement("canvas");
    c.width = EW; c.height = EH;
    c.getContext("2d").drawImage(bmp, EX, EY, EW, EH, 0, 0, EW, EH);
    const envoye = c.toDataURL("image/png");
    $("imgIn").src = envoye; $("imgIn").style.display = "block";

    status(`Envoi à Gemini (${EW}×${EH} px, ratio ${meilleurRatio(EW, EH)})…`);
    const res = await appelGemini(key, model, prompt, envoye.split(",")[1], meilleurRatio(EW, EH), size);
    const rb = await createImageBitmap(await (await fetch("data:" + res.mime + ";base64," + res.data)).blob());

    // On extrait la partie correspondant à la sélection et on la met aux dimensions EXACTES W×H
    const sx = (L - EX) / EW * rb.width,  sy = (T - EY) / EH * rb.height;
    const sw = W / EW * rb.width,         sh = H / EH * rb.height;
    const o2 = document.createElement("canvas");
    o2.width = W; o2.height = H;
    const g = o2.getContext("2d");
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    g.drawImage(rb, sx, sy, sw, sh, 0, 0, W, H);
    const final = o2.toDataURL("image/png");
    $("imgOut").src = final; $("imgOut").style.display = "block";

    status("Insertion dans Photopea…");
    await runScript('app.open(' + JSON.stringify(final) + ', null, true);');
    const p = await runScript(scriptPlacement(L, T, W, H));
    if (!p.includes("OK")) throw new Error("Placement du calque non confirmé : vérifiez le résultat dans Photopea.");
    status(`Terminé : calque « Gemini » ${W}×${H} px placé en (${L}, ${T}).`);
  } catch (e) {
    status(String(e.message || e), true);
  } finally {
    btn.disabled = false;
  }
}
$("go").addEventListener("click", go);
</script>
</body>
</html>
